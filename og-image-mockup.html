<!doctype html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>BETER OG image mockup</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Verbatim copy of index.html's <style> block, so this renders identically -->
    <style>
        html {
            scroll-behavior: smooth;
            scroll-padding-top: 100px;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            line-height: 1.6;
            color: #333;
            background: #ffffff;
            min-height: 100vh;
            padding: 0;
        }

        h1, h2, h3, h4, h5 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
        }

        .masthead {
            background: #ed507e;
            position: relative;
            overflow: hidden;
            padding-top: 120px;
        }

        .text-primary {
            color: #ed507e !important;
        }

        .masthead .container {
            position: relative;
            z-index: 1;
        }

        .masthead .section-label {
            font-size: 1.1rem;
        }

        .section-label {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #ed507e;
            margin-bottom: 10px;
        }

        .masthead img {
            max-width: 360px;
        }
    </style>

    <!-- Fixed 2400x1260 OG canvas (2x of the 1200x630 og:image standard, for retina sharpness).
         The inner .scale-wrap is the untouched 1200x630 composition, scaled 2x — so this is
         a pixel-doubled render of the exact same layout, not a re-derived one. -->
    <style>
        html, body {
            width: 2400px;
            height: 1260px;
            overflow: hidden;
        }

        .og-canvas {
            width: 2400px;
            height: 1260px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .scale-wrap {
            width: 1200px;
            height: 630px;
            transform: scale(2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scale-wrap .masthead {
            width: 100%;
            height: 100%;
            padding-top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Larger logo for the OG banner: the image's height is 2em of the h1's font-size
           (see index.html's inline img style), so grow that, not max-width. */
        .scale-wrap h1 {
            font-size: 5.04rem;
        }

        .scale-wrap .masthead img {
            max-width: none;
        }

        /* Scale the tagline up to match, so its width lines up with the wider logo */
        .scale-wrap .section-label {
            font-size: 2.05rem;
        }
    </style>
</head>
<body>

    <div class="og-canvas">
        <div class="scale-wrap">
            <header class="masthead text-white text-center pb-4">
                <div class="container pt-3 pb-4">
                    <h1 class="display-4 mb-3 mt-2">
                        <img src="img/noBgWhitePink.svg" alt="" style="height: 2.0em; position: relative; top: -0.1em;">
                        <span class="visually-hidden">BETER — Platformteam as a Service</span>
                    </h1>
                    <span class="section-label" style="color: rgba(255, 255, 255, 0.8);">Platformteam as a Service</span>
                </div>
            </header>
        </div>
    </div>

</body>
</html>
