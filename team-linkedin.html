<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Het Team – BETER.</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #canvas {
            width: 1080px;
            height: 1080px;
            min-width: 1080px;
            min-height: 1080px;
            background: #131313;
            font-family: 'Open Sans', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 80px 0;
            gap: 0;
            position: relative;
            overflow: hidden;
        }

        /* Scattered symbol overlay — same as masthead */
        .deco-symbols-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.9;
        }

        .tagline {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.85);
            position: relative;
            z-index: 1;
            white-space: nowrap;
        }

        .logo-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            position: relative;
            z-index: 1;
        }

        .logo {
            position: relative;
            z-index: 1;
        }

        .logo img {
            width: 990px;
        }

        .team {
            display: flex;
            justify-content: center;
            gap: 60px;
            position: relative;
            z-index: 1;
        }

        .team-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .team-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: #ed507e;
            letter-spacing: 0.06em;
        }

        .team-photo-wrap {
            width: 290px;
            height: 500px;
            border-radius: 14px;
            overflow: hidden;
            border: 3px solid rgba(255,255,255,0.85);
        }

        .team-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            transform: scale(1.25);
            transform-origin: top center;
            display: block;
        }
    </style>
</head>
<body>
<div id="canvas" class="masthead">

    <div class="logo-group">
        <div class="logo">
            <img src="img/noBgColor.svg" alt="BETER.">
        </div>
        <span class="tagline">Platformteam as a Service</span>
    </div>

    <div class="team">
        <div class="team-card">
            <div class="team-photo-wrap">
                <img src="img/hs/ht-gjb-01.png" alt="Gijsjan Baars" class="team-photo">
            </div>
            <span class="team-name">Gijsjan</span>
        </div>
        <div class="team-card">
            <div class="team-photo-wrap">
                <img src="img/hs/hs-st-01.png" alt="Sebastiaan Tammer" class="team-photo" style="object-position: 30% top;">
            </div>
            <span class="team-name">Sebastiaan</span>
        </div>
        <div class="team-card">
            <div class="team-photo-wrap">
                <img src="img/hs/hs-rvr-01.png" alt="Reinier van Rutten" class="team-photo">
            </div>
            <span class="team-name">Reinier</span>
        </div>
    </div>

    <script src="js/masthead-symbols.js"></script>
</div>
</body>
</html>
