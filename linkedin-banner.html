<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BETER. LinkedIn Banner</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #canvas {
            width: 1128px;
            height: 191px;
            min-width: 1128px;
            min-height: 191px;
            position: relative;
            overflow: hidden;
            background: #000;
            border: 1px solid rgba(237, 80, 126, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 22px 44px 18px;
            font-family: 'Open Sans', sans-serif;
        }

        .masthead .deco-symbols-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .brand-block {
            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 1;
            display: flex;
            align-items: center;
            transform: translate(-50%, -42%);
        }

        .brand-block img {
            display: block;
            width: 470px;
            height: auto;
        }

        .copy {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 2px;
            position: absolute;
            inset: 12px 0 auto 0;
            pointer-events: none;
        }

        .eyebrow {
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.20em;
            text-transform: uppercase;
            color: #ed507e;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="canvas" class="masthead" role="img" aria-label="BETER LinkedIn banner met zwarte achtergrond en roze branding">
        <div class="copy">
            <div class="eyebrow">Platformteam as a Service</div>
        </div>

        <div class="brand-block">
            <img src="img/noBgColor.svg" alt="BETER">
        </div>
    </div>

    <script src="js/masthead-symbols.js"></script>
</body>
</html>
